<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>Stations — MyMusics</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/style.css?v=mode-switch-youtube-4">
  <link rel="stylesheet" href="/manage.css">
  <script defer src="/manage.js?v=management-split-1"></script>
  <link rel="stylesheet" href="/app-theme.css?v=mode-switch-youtube-3">
  <link rel="stylesheet" href="/management-theme.css?v=mode-switch-youtube-1">
</head>
<body class="management-page">
  <div class="app-shell manage-shell">
    <aside class="sidebar mode-sidebar" aria-label="Radio stations">
      <a class="brand mode-brand" href="/" aria-label="MyMusics home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>my<span class="brand-light">musics</span></span>
      </a>
      <nav class="mode-switch mode-switch-three" aria-label="Modes">
        <a class="mode" href="/">Radio</a>
        <a class="mode" href="/youtube.html">YouTube</a>
        <a class="mode" href="/music.html">Music</a>
      </nav>
      <div class="side-label">Manage</div>
      <nav class="sidebar-actions" aria-label="Pages">
        <a class="sidebar-page" href="/">Radio</a>
        <a class="sidebar-page" href="/music.html">Music</a>
        <a class="sidebar-page selected" href="/manage.html#stations" aria-current="page">Management</a>
        <a class="sidebar-page" href="/help.html">Help</a>
      </nav>
    </aside>
    <main>
      <section class="manage-intro">
        <p class="kicker">Radio</p>
        <h1>Stations and genres</h1>
      </section>
      <details class="manage-tools panel">
        <summary class="manage-tools-summary">
          <span><span class="eyebrow">Library tools</span><strong>Organize genres and add stations</strong></span>
        </summary>
        <div class="manage-tools-content">
          <section class="genre-tools" aria-labelledby="genre-heading">
            <div class="panel-heading"><div><p class="eyebrow">Organize</p><h2 id="genre-heading">Manage genre</h2></div><span id="genre-count" class="count"></span></div>
            <label class="sr-only" for="organize-genre">Select genre to organize</label>
            <select id="organize-genre" class="genre-picker"></select>
            <form id="new-genre-form" class="inline-form">
              <label class="sr-only" for="new-genre">New genre</label>
              <input id="new-genre" name="name" placeholder="New genre name" maxlength="40" required>
              <button type="submit" class="icon-button" aria-label="Add genre">+</button>
            </form>
            <form id="rename-form" class="rename-form" hidden>
              <label for="rename-genre">Rename selected genre</label>
              <div class="inline-form"><input id="rename-genre" name="name" maxlength="40" required><button type="submit" class="small-button">Save name</button></div>
            </form>
            <div id="genre-delete" class="genre-delete" hidden>
              <button id="delete-genre" class="delete-genre-button" type="button">Delete genre</button>
              <p id="genre-delete-hint">Deleting a genre also removes all its stations.</p>
            </div>
          </section>
          <section class="station-tools" aria-labelledby="add-station-heading">
            <div class="panel-heading"><div><p class="eyebrow">New stream</p><h2 id="add-station-heading">Add station</h2></div></div>
            <p class="tile-copy">Add a stream to <strong id="add-station-genre">the selected genre</strong>.</p>
            <button id="add-station" class="save-button" type="button">Add station</button>
          </section>
        </div>
      </details>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
      <details id="genre-stations" class="stations-panel panel" open>
        <summary class="genre-stations-summary">
          <span><span class="eyebrow">Stations</span><h2 id="stations-heading">Choose a genre</h2></span>
          <span id="station-count" class="count" role="status" aria-live="polite"></span>
          <span class="genre-stations-toggle" aria-hidden="true"></span>
        </summary>
        <div class="genre-stations-content">
          <div id="managed-station-filter-wrap" class="managed-station-filter"><label for="managed-station-filter">Search stations</label><input id="managed-station-filter" type="search" placeholder="Search this genre by name" autocomplete="off" aria-controls="station-list"></div>
          <div id="station-list" class="managed-stations"></div>
        </div>
      </details>
    </main>
  </div>
  <script defer src="/tv-navigation.js?v=tv-navigation-3"></script>
  <script type="module" src="/app-meta.js?v=browser-meta-2"></script>
</body>
</html>
